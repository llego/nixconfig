theme = "rose_pine_transparent"

[keys.normal]
C-right = "move_next_word_start"
C-left = "move_prev_word_start"
C-down = "page_cursor_half_down"
C-up = "page_cursor_half_up"

[keys.insert]
C-right = "move_next_word_start"
C-left = "move_prev_word_start"

[editor]
bufferline = "multiple"
true-color = true

[editor.soft-wrap]
enable = true
